<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card">
        <h2>Processing</h2>
        
        <div class="loader-wrapper" style="width: 100%; height: 120px; display: flex; align-items: center; justify-content: center;">
            
            <div class="uiverse-loader">
              <svg viewBox="0 0 80 80">
                <circle r="32" cy="40" cx="40" id="test"></circle>
              </svg>
            </div>
            
            <div class="uiverse-loader triangle">
              <svg viewBox="0 0 86 80">
                <polygon points="43 8 79 72 7 72"></polygon>
              </svg>
            </div>
            
            <div class="uiverse-loader">
              <svg viewBox="0 0 80 80">
                <rect height="64" width="64" y="8" x="8"></rect>
              </svg>
            </div>

        </div>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
            <p id="status" class="status-text">Starting evaluation...</p>
            <div class="progress-container">
                <div id="bar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        let upload_id = "{{ upload_id }}";

        fetch(`/start_processing/${upload_id}`);

        let interval = setInterval(() => {
            fetch(`/progress/${upload_id}`)
            .then(res => res.json())
            .then(data => {
                let p = data.progress;
                document.getElementById("bar").style.width = p + "%";
                document.getElementById("status").innerText = "Progress: " + p + "%";

                if (p === 100) {
                    clearInterval(interval);
                    window.location.href = `/result/${upload_id}`;
                }
            });
        }, 1000);
    </script>
</body>
</html>
